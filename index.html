<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Product House</title>
<style>
/* ===== Design tokens ===== */
:root{--navy:#0f1b3d;--bg:#f5f6fb;--card:#fff;--blue:#2f5bff;--violet:#7a3cff;--line:#e2e5f0;--muted:#56627f;--ok:#0b7a4b;--bad:#c62850;--r:14px;--sh:0 2px 10px rgba(15,27,61,.07);--grad:linear-gradient(135deg,var(--blue),var(--violet));--s:16px;font-family:"Segoe UI",Inter,system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);line-height:1.5;overflow-x:hidden}
h1,h2,h3{line-height:1.2;margin:0 0 .5em}h1{font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.02em}h2{font-size:1.4rem}h3{font-size:1.05rem}p{margin:0 0 .8em}
a{color:var(--blue)}:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.muted{color:var(--muted)}small{font-size:.82rem}.sr{position:absolute;left:-9999px}.wrap{max-width:1180px;margin:0 auto;padding:0 var(--s)}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:.65rem 1.1rem;min-height:44px;background:var(--grad);color:#fff;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(47,91,255,.3)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.danger{background:var(--bad)}.btn.sm{min-height:36px;padding:.3rem .7rem;font-size:.85rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.row.sb{justify-content:space-between}
input,select,textarea{font:inherit;width:100%;padding:.65rem .8rem;border:1px solid #c9cee0;border-radius:10px;background:#fff;color:var(--navy);min-height:44px}
textarea{min-height:110px;resize:vertical}input[type=checkbox]{width:auto;min-height:0}
.field{margin-bottom:1rem}.field label{display:block;font-weight:600;margin-bottom:.3rem;font-size:.92rem}.err,.msg{color:var(--bad);font-size:.85rem;min-height:1em}
.banner{background:#fff6d6;border:1px solid #f0d675;color:#5c4500;padding:.6rem .9rem;border-radius:10px;font-size:.88rem;margin-bottom:1rem}
.chip{display:inline-block;background:#eef1ff;color:#2443c4;border-radius:99px;padding:.1rem .6rem;font-size:.78rem;font-weight:600}.chip.ok{background:#dcf5e8;color:var(--ok)}.chip.off{background:#eceef5;color:var(--muted)}.chip.bad{background:#fde3ea;color:var(--bad)}
/* header */
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hd{display:flex;align-items:center;gap:1rem;min-height:64px;flex-wrap:wrap;padding:.4rem 0}
.logo{font-weight:800;font-size:1.15rem;text-decoration:none;color:var(--navy);display:flex;align-items:center;gap:.5rem}.logo i{width:26px;height:26px;border-radius:8px;background:var(--grad);display:inline-block}
nav.main{display:flex;gap:.2rem;flex:1;flex-wrap:wrap}nav.main a{padding:.4rem .7rem;border-radius:8px;text-decoration:none;color:var(--navy);font-weight:500;font-size:.93rem}nav.main a:hover,nav.main a.on{background:#eef1ff;color:#2443c4}
.sform{display:flex;gap:.4rem;min-width:200px}.menu{position:relative}.pop{position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:.6rem;min-width:260px;z-index:30}.pop[hidden]{display:none}
.burger{display:none}
@media(max-width:860px){.burger{display:inline-flex}nav.main{display:none;flex-basis:100%;flex-direction:column}nav.main.open{display:flex}.sform{flex-basis:100%}}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s}.card:hover{transform:translateY(-3px)}
.cb{padding:1rem;display:flex;flex-direction:column;gap:.45rem;flex:1}.cb .row:last-child{margin-top:auto}
.art{aspect-ratio:16/9;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.6rem;overflow:hidden;width:100%}.art img{width:100%;height:100%;object-fit:cover}
.kw{display:flex;gap:.3rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.sec{padding:1.6rem 0}.hero{padding:3.5rem 0 2rem}.hero p{max-width:560px;font-size:1.1rem}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.8rem}.cat{padding:1rem;border:1px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer;font:inherit;text-align:left;color:var(--navy)}.cat:hover{border-color:var(--blue)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-bottom:1.2rem;align-items:end}
.empty{text-align:center;padding:2.5rem 1rem;background:#fff;border:1px dashed #c9cee0;border-radius:var(--r)}
/* auth */
.authwrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.authhero{background:var(--grad);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:center}.authhero .logo{color:#fff}.authhero .logo i{background:#fff}
.auth{padding:2rem;max-width:480px;margin:auto;width:100%}.tabs,.seg{display:flex;gap:.3rem;background:#eceef6;padding:.25rem;border-radius:12px;margin-bottom:1rem}.tabs button,.seg button{flex:1;border:0;background:none;font:inherit;font-weight:600;padding:.55rem;border-radius:9px;cursor:pointer;color:var(--navy);min-height:44px}.tabs .on,.seg .on{background:#fff;box-shadow:var(--sh)}
.meter{height:6px;border-radius:9px;background:#e5e8f2;overflow:hidden}.meter i{display:block;height:100%;width:0;transition:width .2s}
@media(max-width:800px){.authwrap{grid-template-columns:1fr}.authhero{padding:1.5rem}}
/* dashboard */
.dash{display:grid;grid-template-columns:230px 1fr;gap:1.2rem;padding:1.2rem var(--s);max-width:1300px;margin:0 auto}
.side{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:.6rem;height:fit-content;position:sticky;top:80px}.side button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;padding:.65rem .8rem;border-radius:9px;cursor:pointer;min-height:44px;color:var(--navy)}.side button:hover{background:#f1f3fb}.side button.on{background:#eef1ff;color:#2443c4;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem;margin-bottom:1.2rem}.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1rem}.stat b{font-size:1.5rem;display:block}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.2rem;margin-bottom:1.2rem;box-shadow:var(--sh)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:.6rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th button{border:0;background:none;font:inherit;font-weight:700;cursor:pointer;color:var(--navy)}
.thumb{width:64px;height:36px;border-radius:6px;overflow:hidden;font-size:.8rem}.sbtn{display:none}
@media(max-width:860px){.dash{grid-template-columns:1fr}.side{position:static;display:none}.side.open{display:block}.sbtn{display:inline-flex;margin-bottom:.8rem}}
.bars{display:flex;align-items:flex-end;gap:.6rem;height:150px}.bars div{flex:1;background:var(--grad);border-radius:6px 6px 0 0;position:relative;min-height:4px}.bars span{position:absolute;bottom:-1.4rem;left:0;right:0;text-align:center;font-size:.72rem;color:var(--muted)}
.prev{border:1px dashed #b7bdd4;border-radius:12px;min-height:110px;display:grid;place-items:center;overflow:hidden;margin-bottom:.4rem;max-width:320px}.prev img{max-width:100%;display:block}
.tag{display:inline-flex;gap:.3rem;align-items:center;background:#eef1ff;color:#2443c4;border-radius:99px;padding:.1rem .3rem .1rem .7rem;font-size:.82rem;margin:.2rem .2rem 0 0}.tag button{border:0;background:none;cursor:pointer;font-size:1rem;min-width:28px;min-height:28px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.1rem;max-width:760px}.plan{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.4rem}.plan.hi{border:2px solid var(--violet)}.plan .price{font-size:2rem;font-weight:800}.plan ul{padding-left:1.1rem}
dialog{border:0;border-radius:var(--r);padding:0;width:min(640px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(15,27,61,.3)}dialog::backdrop{background:rgba(15,27,61,.5)}.dh{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}.dh h2{margin:0}.db{padding:1.2rem}.x{border:0;background:none;font-size:1.6rem;cursor:pointer;min-width:44px;min-height:44px}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.7rem 1.1rem;border-radius:10px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}#toast.on{opacity:1}
footer{border-top:1px solid var(--line);background:#fff;margin-top:2rem;padding:1.5rem 0}footer a{margin-right:1rem}
.spin{width:18px;height:18px;border:3px solid #ccd;border-top-color:var(--violet);border-radius:50%;display:inline-block;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:1ms!important}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="dlg" aria-modal="true"></dialog>
<script>
'use strict';
/* =====================================================================
   DIGITAL PRODUCT HOUSE - frontend prototype (DEMO MODE)
   - localStorage is NOT a secure database and does NOT sync across users/devices.
     Separate sellers, shared stores and real marketplace data need a backend.
   - Never stored in the browser: passwords, tokens, API keys, payment secrets.
   ===================================================================== */

/* ---------- Config ---------- */
const RATIO_TOLERANCE = 0.03;               // configurable aspect-ratio tolerance (3%)
const PAGE = 6;
const DEFAULT_CATS = ['Video Editing','Graphics and Design','Templates','AI Tools','Creator Resources','Other'];
// EDITABLE PLACEHOLDER BENEFITS - platform owner to define real benefits.
const PLANS = [
  {id:'m', name:'Monthly Membership', price:99, days:30, hi:true, features:['Placeholder benefit A (to be defined)','Placeholder benefit B (to be defined)','Placeholder benefit C (to be defined)']},
  {id:'w', name:'7-Day Membership', price:49, days:7, features:['Placeholder benefit A (to be defined)','Placeholder benefit B (to be defined)']}
];
const INFO = {About:'Digital Product House is a digital products marketplace prototype.',Contact:'Placeholder: contact details to be added by the platform owner.',Help:'Placeholder: help-centre content to be added.','Privacy Policy':'Placeholder: a real privacy policy must be written before launch.',Terms:'Placeholder: real terms and conditions must be written before launch.'};

/* ---------- Helpers ---------- */
const $app = document.getElementById('app'), dlg = document.getElementById('dlg');
const inr = n => '\u20B9' + Number(n).toLocaleString('en-IN');
const fdate = t => new Date(t).toLocaleDateString('en-IN');
// Safe DOM builder: text always goes through text nodes (no innerHTML).
const h = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(9).forEach(c => e.append(c instanceof Node ? c : document.createTextNode(c ?? '')));
  return e;
};
let tt; const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.className = 'on'; clearTimeout(tt); tt = setTimeout(() => t.className = '', 3200); };
const go = hash => { if (location.hash === '#' + hash) render(); else location.hash = hash; };
function modal(title, ...nodes) {
  dlg.replaceChildren(h('div', {class:'dh'}, h('h2', {}, title), h('button', {class:'x','aria-label':'Close',onclick:() => dlg.close()}, '\u00D7')), h('div', {class:'db'}, ...nodes));
  if (!dlg.open) dlg.showModal(); return dlg;
}
const confirmBox = (msg, label = 'Delete') => new Promise(res => {
  modal('Please confirm', h('p', {}, msg), h('div', {class:'row'},
    h('button', {class:'btn ghost', onclick:() => { dlg.close(); res(false); }}, 'Cancel'),
    h('button', {class:'btn danger', onclick:() => { dlg.close(); res(true); }}, label)));
});
const demoBanner = t => h('div', {class:'banner', role:'note'}, h('b', {}, 'DEMO ONLY: '), t);

/* ---------- State (non-sensitive only) ---------- */
const MEM = {imgs:{}, logo:null, orders:[], notes:[]};   // session-only: object URLs and demo notifications
const defaults = () => ({user:null, store:{name:'', desc:'', upi:'', saved:false}, mine:[], cats:[...DEFAULT_CATS], prefs:{orders:true, login:true, marketing:false, analytics:false}});
let S; try { S = Object.assign(defaults(), JSON.parse(localStorage.getItem('dph') || '{}')); } catch (e) { S = defaults(); }
const save = () => { try { localStorage.setItem('dph', JSON.stringify(S)); } catch (e) { /* storage full/blocked */ } };

/* FUTURE EMAIL INTEGRATION:
   Connect a secure backend and an approved email service here.
   Do not expose email service credentials in frontend JavaScript.
   Planned: registration, login alerts, password reset, order and membership emails. */
function notify(subject, body) { MEM.notes.unshift({subject, body, t:Date.now()}); toast('Preview only, no email was sent: ' + subject); }

/* ---------- Sample (demo) marketplace data ---------- */
const NOW = Date.now(), D = 864e5;
const STORES = {s1:{name:'Reel Forge Studio', desc:'Editing packs for short-form creators.'}, s2:{name:'Pixel Orchard', desc:'Backgrounds, templates and design assets.'}, s3:{name:'Creator Kit Co', desc:'Tools and resources for solo creators.'}, me:{}};
const storeOf = id => id === 'me' ? {name:S.store.name || 'My Store', desc:S.store.desc} : STORES[id];
// [id,name,store,category,price,keywords,description,popularity(demo),sales(demo),daysAgo]
const SAMPLE = [
 ['p1','Premium Video Editing Pack','s1','Video Editing',799,['video','editing','presets'],'Transitions, overlays and colour presets for fast short-form edits.',9,140,3],
 ['p2','Typography Reels Pack','s1','Video Editing',499,['typography','reels','text'],'Animated text styles ready to drop into reels and shorts.',8,96,9],
 ['p3','Gradient Background Collection','s2','Graphics and Design',299,['gradient','background','wallpaper'],'High-resolution gradient backgrounds for thumbnails and posts.',7,210,15],
 ['p4','XML Animation Pack','s1','Video Editing',599,['xml','animation','mobile'],'Animation project files for mobile editing apps.',6,58,2],
 ['p5','Social Media Templates','s2','Templates',399,['social','templates','posts'],'Editable post and story layouts for consistent branding.',9,175,20],
 ['p6','Digital Creator Toolkit','s3','Creator Resources',999,['creator','toolkit','bundle'],'A bundle of checklists, planners and asset folders.',10,120,30],
 ['p7','AI Prompt Library','s3','AI Tools',349,['ai','prompts','workflow'],'Organised prompts for scripts, captions and ideas.',7,64,6],
 ['p8','Reel Cover Templates','s2','Templates',249,['cover','reels','thumbnail'],'Cover templates sized for vertical video.',5,40,12],
 ['p9','Sound Effects Bundle','s3','Creator Resources',449,['sound','sfx','audio'],'Royalty-style placeholder SFX bundle for edits.',6,77,25]
].map(([id,name,store,cat,price,kw,desc,pop,sold,ago]) => ({id,name,store,cat,price,kw,desc,pop,sold,created:NOW - ago * D, status:'published'}));
const ALL = () => SAMPLE.concat(S.mine.map(p => ({...p, store:'me', pop:p.pop || 0, sold:p.sold || 0})));
const PUB = () => ALL().filter(p => p.status === 'published');
const SORTS = {best:(a,b)=>b.sold-a.sold, pop:(a,b)=>b.pop-a.pop, new:(a,b)=>b.created-a.created, lo:(a,b)=>a.price-b.price, hi:(a,b)=>b.price-a.price};
// FUTURE BACKEND: replace with verified order/sales records from a server.
const CUSTOMERS = ['Aarav','Diya','Kabir','Meera','Rohan','Isha'];
const DEMO_ORDERS = Array.from({length:26}, (_, i) => {
  const p = SAMPLE[i % SAMPLE.length], st = ['Completed','Pending','Cancelled'][i % 3];
  return {id:'DEMO-' + (1001 + i), prod:p.name, cust:CUSTOMERS[i % 6] + ' (demo)', date:NOW - i * 2 * D, amt:p.price, os:st, ps:st === 'Completed' ? 'Paid (demo)' : st === 'Pending' ? 'Unpaid' : 'Not paid', ds:st === 'Completed' ? 'Delivered (demo)' : 'Locked'};
});

/* ---------- Reusable components ---------- */
function art(p, cls = '') {
  const src = MEM.imgs[p.id];
  const n = [...p.id].reduce((a, c) => a + c.charCodeAt(0), 0) * 7 % 360;
  const box = h('div', {class:'art ' + cls, style:`background:linear-gradient(135deg,hsl(${n} 75% 55%),hsl(${(n + 50) % 360} 75% 38%))`});
  if (src) box.append(h('img', {src, alt:p.name})); else box.append(p.name.split(' ').slice(0, 2).map(w => w[0]).join(''));
  return box;
}
function card(p) {
  return h('article', {class:'card'}, art(p), h('div', {class:'cb'},
    h('span', {class:'chip'}, p.cat), h('h3', {}, p.name),
    h('a', {href:'#store/' + p.store}, storeOf(p.store).name),
    h('p', {class:'muted'}, p.desc.length > 80 ? p.desc.slice(0, 80) + '...' : p.desc),
    h('div', {class:'kw'}, p.kw.slice(0, 4).map(k => h('span', {}, '#' + k))),
    p.store !== 'me' ? h('small', {class:'muted'}, 'DEMO data: ' + p.sold + ' sample sales') : '',
    h('strong', {}, inr(p.price)),
    h('div', {class:'row'}, h('button', {class:'btn ghost sm', onclick:() => go('product/' + p.id)}, 'View product'), h('button', {class:'btn sm', onclick:() => checkout(p)}, 'Buy now'))));
}
const grid = list => list.length ? h('div', {class:'grid'}, list.map(card)) : h('div', {class:'empty'}, h('h3', {}, 'No products found'), h('p', {class:'muted'}, 'Try a different search or clear your filters.'));
const field = (label, ctrl, id) => h('div', {class:'field'}, h('label', {for:id}, label), ctrl, h('div', {class:'err', id:'e-' + id, role:'alert'}));
const setErr = (id, m) => { const e = document.getElementById('e-' + id); if (e) e.textContent = m || ''; return !m; };
const counter = (inp, max) => { const c = h('small', {class:'muted'}); const u = () => c.textContent = inp.value.length + '/' + max; inp.maxLength = max; inp.addEventListener('input', u); u(); return c; };

// Image picker: validates aspect ratio with JS, previews, replace/remove, revokes object URLs.
function picker(ratios, cur, onChange) {
  let url = cur || null, mine = null;
  const msg = h('p', {class:'msg', role:'alert'}), info = h('small', {class:'muted'}), prev = h('div', {class:'prev'});
  const inp = h('input', {type:'file', accept:'image/*', class:'sr', 'aria-label':'Choose image'});
  const rel = () => { if (mine && url === mine) { URL.revokeObjectURL(mine); mine = null; } };
  const rm = h('button', {type:'button', class:'btn ghost sm', onclick:() => { rel(); url = null; info.textContent = ''; onChange(null); draw(); }}, 'Remove image');
  const rep = h('button', {type:'button', class:'btn ghost sm', onclick:() => inp.click()});
  function draw() { prev.replaceChildren(url ? h('img', {src:url, alt:'Preview'}) : h('span', {class:'muted'}, 'No image selected')); rm.hidden = !url; rep.textContent = url ? 'Replace image' : 'Choose image'; }
  inp.addEventListener('change', () => {
    const f = inp.files[0]; if (!f) return; msg.textContent = '';
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => {
      const r = im.width / im.height, ok = ratios.find(([a, b]) => Math.abs(r / (a / b) - 1) <= RATIO_TOLERANCE);
      if (!ok) { URL.revokeObjectURL(u); msg.textContent = `Unsupported ratio (${im.width}\u00D7${im.height}). Use ${ratios.map(x => x.join(':')).join(' or ')}.`; return; }
      rel(); url = mine = u; info.textContent = `Detected ratio ${ok.join(':')} (${im.width}\u00D7${im.height})`; onChange(u); draw();
    };
    im.onerror = () => { URL.revokeObjectURL(u); msg.textContent = 'That file could not be read as an image.'; };
    im.src = u; inp.value = '';
  });
  draw(); return h('div', {}, prev, info, msg, inp, h('div', {class:'row'}, rep, rm));
}

/* ---------- Auth (DEMO MODE) ---------- */
function authView() {
  let mode = 'login', role = 'customer';
  const box = h('div', {class:'auth'});
  const strength = pw => [pw.length >= 8, /[a-z]/.test(pw) && /[A-Z]/.test(pw), /\d/.test(pw), /[^\w\s]/.test(pw)].filter(Boolean).length;
  function enter(email, r) {
    S.user = {email, role:r, name:email.split('@')[0]}; save();   // NOTE: password is never kept
    notify('Welcome (demo)', 'A real system would send a registration/login email here.');
    go(r === 'seller' ? 'dash/overview' : 'home');
  }
  function draw() {
    const signup = mode === 'signup';
    const em = h('input', {id:'em', type:'email', autocomplete:'email'}), pw = h('input', {id:'pw', type:'password', autocomplete: signup ? 'new-password' : 'current-password'});
    const cf = h('input', {id:'cf', type:'password', autocomplete:'new-password'}), terms = h('input', {id:'tc', type:'checkbox'});
    const bar = h('i'), meter = h('div', {class:'meter'}, bar), sl = h('small', {class:'muted'}, 'Password strength');
    pw.addEventListener('input', () => { const s = strength(pw.value); bar.style.width = s * 25 + '%'; bar.style.background = ['#c62850','#c62850','#d98a00','#2f5bff','#0b7a4b'][s]; sl.textContent = 'Password strength: ' + ['too weak','weak','fair','good','strong'][s]; });
    const show = h('button', {type:'button', class:'btn ghost sm', 'aria-pressed':'false', onclick:e => { const t = pw.type === 'password'; pw.type = cf.type = t ? 'text' : 'password'; e.target.textContent = t ? 'Hide password' : 'Show password'; e.target.setAttribute('aria-pressed', t); }}, 'Show password');
    const roleBtns = ['customer','seller'].map(r => h('button', {type:'button', class: r === role ? 'on' : '', onclick:() => { role = r; roleBtns.forEach((b, i) => b.className = ['customer','seller'][i] === role ? 'on' : ''); }}, r === 'customer' ? 'Customer marketplace' : 'Seller dashboard'));
    const form = h('form', {novalidate:true, onsubmit:e => {
      e.preventDefault();
      // FUTURE AUTH INTEGRATION: send credentials over HTTPS to a real auth service (Firebase Auth, Supabase, Auth0...).

    const l = S.mine.filter(p => (!q || p.name.toLowerCase().includes(q)) && (!PF.cat || p.cat === PF.cat) && (!PF.st || p.status === PF.st)).sort(by[PF.sort]);

    out.replaceChildren(h('div', {class:'tw'}, h('table', {}, h('thead', {}, h('tr', {}, ['Image','Name','Price','Category','Status','Created','Actions'].map(c => h('th', {}, c)))), h('tbody', {}, l.map(p => h('tr', {},
      h('td', {}, h('div', {class:'thumb'}, art(p))), h('td', {}, p.name), h('td', {}, inr(p.price)), h('td', {}, p.cat), h('td', {}, h('span', {class:'chip ' + (p.status === 'published' ? 'ok' : 'off')}, p.status === 'published' ? 'Published' : 'Draft')), h('td', {}, fdate(p.created)),
      h('td', {}, h('div', {class:'row'}, h('button', {class:'btn ghost sm', onclick:() => go('dash/edit/' + p.id)}, 'Edit'), h('button', {class:'btn ghost sm', onclick:() => modal('Preview', card({...p, store:'me', sold:0}))}, 'Preview'),
        h('button', {class:'btn ghost sm', onclick:() => { p.status = p.status === 'published' ? 'draft' : 'published'; save(); toast(p.status === 'published' ? 'Published' : 'Unpublished'); draw(); }}, p.status === 'published' ? 'Unpublish' : 'Publish'),
        h('button', {class:'btn danger sm', onclick:async () => { if (await confirmBox('Delete "' + p.name + '"? This cannot be undone.')) { S.mine.splice(S.mine.indexOf(p), 1); delete MEM.imgs[p.id]; save(); toast('Deleted'); draw(); } }}, 'Delete')))))))));
  };
  const bind = (k, c) => { c.addEventListener('input', () => { PF[k] = c.value; draw(); }); return c; };
  draw();
  return h('div', {}, h('div', {class:'row sb'}, h('h1', {}, 'My products'), h('button', {class:'btn', onclick:() => go('dash/add')}, 'Add product')),
    h('div', {class:'filters'}, bind('q', h('input', {type:'search', placeholder:'Search products', 'aria-label':'Search', value:PF.q})),
      bind('cat', h('select', {'aria-label':'Category'}, h('option', {value:''}, 'All categories'), S.cats.map(c => h('option', {value:c, selected:PF.cat === c}, c)))),

}
const OF = {q:'', st:'', key:'date', dir:-1, n:8};
function ordersView() {
  // FUTURE BACKEND: load verified orders from a server here (e.g. fetch('/api/orders') with real auth).
  const out = h('div');
  const draw = () => {
    const q = OF.q.toLowerCase(), l = DEMO_ORDERS.filter(o => (!q || (o.id + o.prod + o.cust).toLowerCase().includes(q)) && (!OF.st || o.os === OF.st)).sort((a, b) => (a[OF.key] > b[OF.key] ? 1 : -1) * OF.dir);
    const cols = [['id','Order ID'],['prod','Product'],['cust','Customer'],['date','Date'],['amt','Amount'],['os','Order status'],['ps','Payment'],['ds','Delivery']];
    out.replaceChildren(l.length ? h('div', {class:'tw'}, h('table', {}, h('thead', {}, h('tr', {}, cols.map(([k, t]) => h('th', {}, h('button', {onclick:() => { OF.dir = OF.key === k ? -OF.dir : 1; OF.key = k; draw(); }}, t + (OF.key === k ? (OF.dir > 0 ? ' \u25B2' : ' \u25BC') : '')))))),
      h('tbody', {}, l.slice(0, OF.n).map(o => h('tr', {}, h('td', {}, o.id), h('td', {}, o.prod), h('td', {}, o.cust), h('td', {}, fdate(o.date)), h('td', {}, inr(o.amt)), h('td', {}, o.os), h('td', {}, o.ps), h('td', {}, o.ds)))))) : h('div', {class:'empty'}, 'No orders match.'),
      l.length > OF.n ? h('p', {style:'text-align:center'}, h('button', {class:'btn ghost', onclick:() => { OF.n += 8; draw(); }}, 'Load more')) : '');
  };
  draw();
  return h('div', {}, h('h1', {}, 'Orders'), demoBanner('Sample orders only. None are real purchases.'), h('div', {class:'filters'},
    h('input', {type:'search', 'aria-label':'Search orders', placeholder:'Search orders', oninput:e => { OF.q = e.target.value; OF.n = 8; draw(); }}),
    h('select', {'aria-label':'Status', onchange:e => { OF.st = e.target.value; draw(); }}, ['','Completed','Pending','Cancelled'].map(v => h('option', {value:v}, v || 'All statuses')))), out);
}
function analytics() {
  const m = [['Apr',12],['May',18],['Jun',15],['Jul',24],['Aug',30],['Sep',27],['Oct',35]], mx = 35, done = DEMO_ORDERS.filter(o => o.os === 'Completed');
  return h('div', {}, h('h1', {}, 'Sales analytics'), demoBanner('All figures are sample data. They are not real orders or revenue.'),
    h('div', {class:'stats'}, [['Total orders (demo)', DEMO_ORDERS.length], ['Sample revenue (demo)', inr(done.reduce((a, o) => a + o.amt, 0))]].map(([l, v]) => h('div', {class:'stat'}, h('b', {}, v), h('small', {class:'muted'}, l)))),
    h('div', {class:'panel'}, h('h2', {}, 'Sales trend (demo orders per month)'), h('div', {class:'bars', style:'margin-bottom:2rem', role:'img', 'aria-label':'Bar chart of demo monthly orders'}, m.map(([k, v]) => h('div', {style:'height:' + v / mx * 100 + '%', title:v + ' orders'}, h('span', {}, k))))),
    h('div', {class:'panel'}, h('h2', {}, 'Best-performing products (demo)'), SAMPLE.slice().sort(SORTS.best).slice(0, 4).map(p => h('p', {}, p.name + ': ' + p.sold + ' sample sales'))),
    h('div', {class:'panel'}, h('h2', {}, 'Recent orders (demo)'), DEMO_ORDERS.slice(0, 5).map(o => h('p', {}, o.id + ' | ' + o.prod + ' | ' + inr(o.amt) + ' | ' + o.os))));
}
function settings() {
  const nm = h('input', {id:'an', value:S.user.name}), sn = h('input', {id:'ssn', value:S.store.name}), sd = h('textarea', {id:'ssd'}, S.store.desc), up = h('input', {id:'ssu', value:S.store.upi});

    h('div', {class:'panel'}, h('h2', {}, 'Account information'), field('Display name', nm, 'an'), h('p', {class:'muted'}, 'Email: ' + S.user.email + ' (demo profile)')),
    h('div', {class:'panel'}, h('h2', {}, 'Store information'), field('Store name', sn, 'ssn'), field('Store description', sd, 'ssd'), field('UPI ID', up, 'ssu'), h('div', {class:'row'}, h('span', {}, 'Store logo: ' + (MEM.logo ? 'set' : 'not set')), h('button', {class:'btn ghost sm', onclick:() => go('dash/store')}, 'Change logo'))),
    h('div', {class:'panel'}, h('h2', {}, 'Notification preferences'), cbs), h('div', {class:'panel'}, h('h2', {}, 'Privacy'), h('p', {class:'muted'}, 'This prototype keeps non-sensitive demo data in your browser. Clear it any time.'),
      h('button', {class:'btn ghost sm', onclick:async () => { if (await confirmBox('Clear all demo data stored in this browser?', 'Clear data')) { localStorage.removeItem('dph'); S = defaults(); toast('Demo data cleared'); go('home'); } }}, 'Clear demo data')),
    h('div', {class:'panel'}, h('h2', {}, 'Membership information'), h('p', {}, 'Current plan: none (demo).'), h('button', {class:'btn ghost sm', onclick:() => go('dash/membership')}, 'View plans')),
    h('div', {class:'row'}, h('button', {class:'btn', onclick:() => {
      let ok = setErr('an', nm.value.trim() ? '' : 'Enter a name.'); ok = setErr('ssn', sn.value.trim() ? '' : 'Store name is required.') && ok;
      ok = setErr('ssu', !up.value.trim() || /^[\w.\-]{2,256}@[A-Za-z]{2,64}$/.test(up.value.trim()) ? '' : 'UPI ID should look like name@bank.') && ok; if (!ok) return;
      S.user.name = nm.value.trim(); Object.assign(S.store, {name:sn.value.trim(), desc:sd.value.trim(), upi:up.value.trim(), saved:true}); cbs.forEach((c, i) => S.prefs[prefs[i][0]] = c.querySelector('input').checked); save(); toast('Settings saved');
    }}, 'Save settings'), h('button', {class:'btn ghost', onclick:() => render(true)}, 'Cancel')));

/* ---------- Router ---------- */
function pageFor(r, a) {
  if (r === 'explore') return exploreView();
  if (r === 'best') { F.sort = 'best'; F.cat = ''; return exploreView(); }
  if (r === 'categories') return h('div', {class:'wrap sec'}, h('h1', {}, 'Categories'), catsView());
  if (r === 'membership') return h('div', {class:'wrap sec'}, h('h1', {}, 'Membership'), demoBanner('Membership checkout is a demo. Benefits are editable placeholders.'), plansView(subscribe));
  if (r === 'product') return productView(a);
  if (r === 'store') return storeView(a || 'me');
  if (r === 'sell') return h('div', {class:'wrap sec'}, h('h1', {}, 'Become a seller'), h('p', {class:'muted'}, 'Create a store, upload products and manage orders from one dashboard.'),
    h('button', {class:'btn', onclick:() => { S.user.role = 'seller'; save(); go('dash/overview'); }}, S.user.role === 'seller' ? 'Open seller dashboard' : 'Switch to seller (demo)'));
  return homeView();
}
function render(keep) {
  const [r, a, b] = (location.hash.slice(1) || 'home').split('/');
  $app.replaceChildren();
  if (dlg.open) dlg.close();
  if (!S.user) { $app.append(authView()); return; }
  if (r === 'dash' && S.user.role !== 'seller') { go('sell'); return; }
  $app.append(header(), r === 'dash' ? dashView(a || 'overview', b) : h('main', {id:'main'}, pageFor(r, a)), footer());
  if (!keep) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => render());
render();
