<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Product House</title>
<style>
:root{--navy:#0f1b3d;--bg:#f7f8fc;--blue:#2f5bff;--violet:#7a3cff;--line:#e5e8f2;--muted:#5a6685;--ok:#0b7a4b;--bad:#c62850;--grad:linear-gradient(135deg,#2f5bff,#7a3cff);font-family:"Segoe UI",Inter,system-ui,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--navy);line-height:1.55;overflow-x:hidden}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,5vw,2.8rem)}h2{font-size:1.35rem}h3{font-size:1.02rem}
p{margin:0 0 .8em}a{color:var(--blue)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.muted{color:var(--muted)}small{font-size:.82rem}
.sr{position:absolute;left:-9999px}
.wrap{max-width:1160px;margin:0 auto;padding-left:20px;padding-right:20px}
.sec{padding-top:26px;padding-bottom:26px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:.6rem 1.1rem;min-height:44px;background:var(--grad);color:#fff;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(47,91,255,.25)}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn.sm{min-height:38px;padding:.3rem .8rem;font-size:.88rem}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
input,select,textarea{font:inherit;width:100%;padding:.6rem .8rem;border:1px solid #cfd4e6;border-radius:12px;background:#fff;color:var(--navy);min-height:44px}
textarea{min-height:110px;resize:vertical}
input[type=checkbox]{width:auto;min-height:0}
.field{margin-bottom:1rem}
.field label{display:block;font-weight:600;margin-bottom:.3rem;font-size:.92rem}
.err,.msg{color:var(--bad);font-size:.85rem;min-height:1em}
.note{color:var(--muted);font-size:.85rem;background:#fff;border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;margin-bottom:1rem}
.chip{display:inline-block;align-self:flex-start;background:#eef1ff;color:#2443c4;border-radius:99px;padding:.1rem .65rem;font-size:.78rem;font-weight:600}
.chip.ok{background:#dcf5e8;color:var(--ok)}.chip.off{background:#eceef5;color:var(--muted)}.chip.bad{background:#fde3ea;color:var(--bad)}
/* header */
header.top{background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hd{display:flex;align-items:center;gap:10px;min-height:64px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.logo{font-weight:800;font-size:1.1rem;text-decoration:none;color:var(--navy);display:flex;align-items:center;gap:.5rem;white-space:nowrap}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--grad);display:inline-block}
nav.main{display:flex;gap:2px;flex:1;margin-left:12px}
nav.main a{padding:.45rem .7rem;border-radius:9px;text-decoration:none;color:var(--navy);font-weight:500;font-size:.92rem;white-space:nowrap}
nav.main a:hover,nav.main a.on{background:#eef1ff;color:#2443c4}
.sform{display:flex;gap:6px;width:250px}
.menu{position:relative}
.pop{position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(15,27,61,.12);padding:.8rem;width:min(290px,86vw);z-index:30}
.pop[hidden]{display:none}
.burger{display:none}
@media(max-width:900px){
.burger{display:inline-flex}
.logo{margin-right:auto}
nav.main{display:none;order:5;flex-basis:100%;flex-direction:column;margin-left:0}
nav.main.open{display:flex}
.sform{order:4;width:100%}
}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.1rem}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(15,27,61,.08)}
.cb{padding:1rem;display:flex;flex-direction:column;gap:.4rem;flex:1}
.cb .row:last-child{margin-top:auto}
.art{aspect-ratio:16/9;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.6rem;overflow:hidden;width:100%}
.art img{width:100%;height:100%;object-fit:cover}
.kw{display:flex;gap:.4rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.hero{padding-top:44px;padding-bottom:20px}
.hero p{max-width:540px;font-size:1.08rem}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.8rem}
.cat{padding:1rem;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;font:inherit;text-align:left;color:var(--navy)}
.cat:hover{border-color:var(--blue)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-bottom:1.2rem;align-items:end}
.empty{text-align:center;padding:2.5rem 1rem;background:#fff;border:1px dashed #c9cee0;border-radius:16px}
/* auth */
.authwrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.authhero{background:var(--grad);color:#fff;padding:3rem;display:flex;flex-direction:column;justify-content:center}
.authhero .logo{color:#fff;margin-bottom:1.5rem}.authhero .logo i{background:#fff}
.auth{padding:2rem 1.2rem;max-width:480px;margin:auto;width:100%}
.tabs,.seg{display:flex;gap:.3rem;background:#eceef6;padding:.25rem;border-radius:12px;margin-bottom:1rem}
.tabs button,.seg button{flex:1;border:0;background:none;font:inherit;font-weight:600;padding:.5rem;border-radius:9px;cursor:pointer;color:var(--navy);min-height:44px}
.tabs .on,.seg .on{background:#fff;box-shadow:0 1px 4px rgba(15,27,61,.12)}
.meter{height:6px;border-radius:9px;background:#e5e8f2;overflow:hidden;margin-top:.4rem}
.meter i{display:block;height:100%;width:0;transition:width .2s}
@media(max-width:800px){.authwrap{grid-template-columns:1fr}.authhero{padding:1.6rem 1.2rem}.authhero h1{font-size:1.7rem}}
/* dashboard */
.dash{display:grid;grid-template-columns:220px 1fr;gap:1.2rem;padding:1.2rem 20px;max-width:1280px;margin:0 auto}
.side{background:#fff;border:1px solid var(--line);border-radius:16px;padding:.6rem;height:fit-content;position:sticky;top:80px}
.side button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;padding:.6rem .8rem;border-radius:10px;cursor:pointer;min-height:44px;color:var(--navy)}
.side button:hover{background:#f1f3fb}
.side button.on{background:#eef1ff;color:#2443c4;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.8rem;margin-bottom:1.2rem}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1rem}
.stat b{font-size:1.4rem;display:block}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.2rem;margin-bottom:1.2rem}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:.6rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th button{border:0;background:none;font:inherit;font-weight:700;cursor:pointer;color:var(--navy)}
.thumb{width:64px;border-radius:6px;overflow:hidden;font-size:.8rem}
.sbtn{display:none}
@media(max-width:860px){.dash{grid-template-columns:1fr;padding:1rem 16px}.side{position:static;display:none}.side.open{display:block}.sbtn{display:inline-flex;margin-bottom:.8rem}}
.bars{display:flex;align-items:flex-end;gap:.6rem;height:150px;margin-bottom:2rem}
.bars div{flex:1;background:var(--grad);border-radius:6px 6px 0 0;position:relative;min-height:4px}
.bars span{position:absolute;bottom:-1.4rem;left:0;right:0;text-align:center;font-size:.72rem;color:var(--muted)}
.prev{border:1px dashed #b7bdd4;border-radius:14px;min-height:110px;display:grid;place-items:center;overflow:hidden;margin-bottom:.4rem;max-width:320px}
.prev img{max-width:100%;display:block}
.tag{display:inline-flex;gap:.3rem;align-items:center;background:#eef1ff;color:#2443c4;border-radius:99px;padding:.1rem .3rem .1rem .7rem;font-size:.82rem;margin:.2rem .2rem 0 0}
.tag button{border:0;background:none;cursor:pointer;font-size:1rem;min-width:28px;min-height:28px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.1rem;max-width:760px}
.plan{background:#fff;border:1px solid var(--line);border-radius:16px;padding:1.4rem}
.plan.hi{border:2px solid var(--violet)}
.plan .price{font-size:2rem;font-weight:800}
.plan ul{padding-left:1.1rem}
dialog{border:0;border-radius:18px;padding:0;width:min(600px,94vw);max-height:92vh;box-shadow:0 20px 60px rgba(15,27,61,.3)}
dialog::backdrop{background:rgba(15,27,61,.5)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.2rem;border-bottom:1px solid var(--line)}
.dh h2{margin:0}
.db{padding:1.2rem}
.x{border:0;background:none;font-size:1.6rem;cursor:pointer;min-width:44px;min-height:44px}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.7rem 1.1rem;border-radius:12px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
footer{border-top:1px solid var(--line);background:#fff;margin-top:2rem;padding:1.5rem 0}
footer a{margin-right:1rem}
.spin{width:18px;height:18px;border:3px solid #ccd;border-top-color:var(--violet);border-radius:50%;display:inline-block;vertical-align:middle;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:1ms!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg" aria-modal="true"></dialog>
<script>
'use strict';
/* =====================================================================
   DIGITAL PRODUCT HOUSE - frontend (GitHub Pages ready)
   NOTE: localStorage is not a secure database and does not sync across
   users or devices. Real accounts, shared stores, orders, payments and
   protected downloads need a backend service.
   Never stored in the browser: passwords, tokens, API keys, payment secrets.
   ===================================================================== */

/* ---------- Config ---------- */
const RATIO_TOLERANCE = 0.03;   // aspect-ratio tolerance (3%)
const PAGE = 6;
const DEFAULT_CATS = ['Video Editing','Graphics and Design','Templates','AI Tools','Creator Resources','Other'];
// EDITABLE: change plan names, prices and benefits here.
const PLANS = [
  {id:'m', name:'Monthly Membership', price:99, days:30, hi:true, features:['Benefit A (to be defined)','Benefit B (to be defined)','Benefit C (to be defined)']},
  {id:'w', name:'7-Day Membership', price:49, days:7, features:['Benefit A (to be defined)','Benefit B (to be defined)']}
];
const INFO = {
  About:'Digital Product House is a marketplace for digital products.',
  Contact:'Contact details will be added here.',
  Help:'Help centre content will be added here.',
  'Privacy Policy':'Privacy policy text will be added here before launch.',
  Terms:'Terms and conditions text will be added here before launch.'
};

/* ---------- Helpers ---------- */
const $app = document.getElementById('app');
const dlg = document.getElementById('dlg');
const inr = n => '\u20B9' + Number(n).toLocaleString('en-IN');
const fdate = t => new Date(t).toLocaleDateString('en-IN');
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const UPI_RE = /^[\w.\-]{2,256}@[A-Za-z]{2,64}$/;

// Safe DOM builder: text always goes through text nodes (no innerHTML).
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(9).forEach(c => e.append(c instanceof Node ? c : document.createTextNode(c == null ? '' : c)));
  return e;
}
let tt;
function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.className = 'on';
  clearTimeout(tt); tt = setTimeout(() => { t.className = ''; }, 3200);
}
function go(hash) { if (location.hash === '#' + hash) render(); else location.hash = hash; }
function modal(title, ...nodes) {
  dlg.replaceChildren(
    h('div', {class:'dh'}, h('h2', {}, title), h('button', {class:'x', 'aria-label':'Close', onclick:() => dlg.close()}, '\u00D7')),
    h('div', {class:'db'}, ...nodes));
  if (!dlg.open) dlg.showModal();
}
function confirmBox(msg, label) {
  return new Promise(res => {
    modal('Please confirm', h('p', {}, msg), h('div', {class:'row'},
      h('button', {class:'btn ghost', onclick:() => { dlg.close(); res(false); }}, 'Cancel'),
      h('button', {class:'btn danger', onclick:() => { dlg.close(); res(true); }}, label || 'Delete')));
  });
}
const note = t => h('div', {class:'note'}, t);
const info = k => modal(k, h('p', {}, INFO[k]));

/* ---------- State (non-sensitive only) ---------- */
const MEM = {imgs:{}, logo:null, orders:[], notes:[]};   // session only
const defaults = () => ({user:null, store:{name:'', desc:'', upi:'', saved:false}, mine:[], cats:[...DEFAULT_CATS], prefs:{orders:true, login:true, marketing:false, analytics:false}});
let S;
try { S = Object.assign(defaults(), JSON.parse(localStorage.getItem('dph') || '{}')); } catch (e) { S = defaults(); }
function save() { try { localStorage.setItem('dph', JSON.stringify(S)); } catch (e) { /* storage blocked */ } }

/* FUTURE EMAIL INTEGRATION:
   Connect a secure backend and an approved email service here.
   Do not expose email service credentials in frontend JavaScript.
   Planned: registration, login alerts, password reset, order and membership emails. */
function notify(subject, body) {
  MEM.notes.unshift({subject, body});
  toast(subject);
}

/* ---------- Sample catalogue ---------- */
const NOW = Date.now(), D = 864e5;
const STORES = {
  s1:{name:'Reel Forge Studio', desc:'Editing packs for short-form creators.'},
  s2:{name:'Pixel Orchard', desc:'Backgrounds, templates and design assets.'},
  s3:{name:'Creator Kit Co', desc:'Tools and resources for solo creators.'}
};
function storeOf(id) { return id === 'me' ? {name:S.store.name || 'My Store', desc:S.store.desc} : STORES[id]; }
// [id, name, store, category, price, keywords, description, popularity, sales-rank, daysAgo]
const SAMPLE = [
 ['p1','Premium Video Editing Pack','s1','Video Editing',799,['video','editing','presets'],'Transitions, overlays and colour presets for fast short-form edits.',9,140,3],
 ['p2','Typography Reels Pack','s1','Video Editing',499,['typography','reels','text'],'Animated text styles ready to drop into reels and shorts.',8,96,9],
 ['p3','Gradient Background Collection','s2','Graphics and Design',299,['gradient','background','wallpaper'],'High-resolution gradient backgrounds for thumbnails and posts.',7,210,15],
 ['p4','XML Animation Pack','s1','Video Editing',599,['xml','animation','mobile'],'Animation project files for mobile editing apps.',6,58,2],
 ['p5','Social Media Templates','s2','Templates',399,['social','templates','posts'],'Editable post and story layouts for consistent branding.',9,175,20],
 ['p6','Digital Creator Toolkit','s3','Creator Resources',999,['creator','toolkit','bundle'],'A bundle of checklists, planners and asset folders.',10,120,30],
 ['p7','AI Prompt Library','s3','AI Tools',349,['ai','prompts','workflow'],'Organised prompts for scripts, captions and ideas.',7,64,6],
 ['p8','Reel Cover Templates','s2','Templates',249,['cover','reels','thumbnail'],'Cover templates sized for vertical video.',5,40,12],
 ['p9','Sound Effects Bundle','s3','Creator Resources',449,['sound','sfx','audio'],'A bundle of sound effects for video edits.',6,77,25]
].map(a => ({id:a[0], name:a[1], store:a[2], cat:a[3], price:a[4], kw:a[5], desc:a[6], pop:a[7], sold:a[8], created:NOW - a[9] * D, status:'published'}));
const ALL = () => SAMPLE.concat(S.mine.map(p => ({...p, store:'me', pop:p.pop || 0, sold:p.sold || 0})));
const PUB = () => ALL().filter(p => p.status === 'published');
// "Best Selling" ranks by sales-rank. FUTURE BACKEND: rank by verified sales records.
const SORTS = {
  best:(a, b) => b.sold - a.sold,
  pop:(a, b) => b.pop - a.pop,
  new:(a, b) => b.created - a.created,
  lo:(a, b) => a.price - b.price,
  hi:(a, b) => b.price - a.price
};
// FUTURE BACKEND: load verified orders from a server instead of this sample list.
const CUSTOMERS = ['Aarav','Diya','Kabir','Meera','Rohan','Isha'];
const ORDERS = Array.from({length:26}, (_, i) => {
  const p = SAMPLE[i % SAMPLE.length], st = ['Completed','Pending','Cancelled'][i % 3];
  return {id:'ORD-' + (1001 + i), prod:p.name, cust:CUSTOMERS[i % 6], date:NOW - i * 2 * D, amt:p.price, os:st,
    ps: st === 'Completed' ? 'Paid' : st === 'Pending' ? 'Unpaid' : 'Not paid',
    ds: st === 'Completed' ? 'Delivered' : 'Locked'};
});

/* ---------- Reusable components ---------- */
function art(p, cls) {
  const src = MEM.imgs[p.id];
  const n = [...p.id].reduce((a, c) => a + c.charCodeAt(0), 0) * 7 % 360;
  const box = h('div', {class:'art ' + (cls || ''), style:'background:linear-gradient(135deg,hsl(' + n + ' 70% 55%),hsl(' + ((n + 50) % 360) + ' 70% 40%))'});
  if (src) box.append(h('img', {src:src, alt:p.name}));
  else box.append(p.name.split(' ').slice(0, 2).map(w => w[0]).join(''));
  return box;
}
function card(p) {
  return h('article', {class:'card'}, art(p),
    h('div', {class:'cb'},
      h('span', {class:'chip'}, p.cat),
      h('h3', {}, p.name),
      h('a', {href:'#store/' + p.store}, storeOf(p.store).name),
      h('p', {class:'muted'}, p.desc.length > 80 ? p.desc.slice(0, 80) + '...' : p.desc),
      h('div', {class:'kw'}, p.kw.slice(0, 4).map(k => h('span', {}, '#' + k))),
      h('strong', {}, inr(p.price)),
      h('div', {class:'row'},
        h('button', {class:'btn ghost sm', onclick:() => go('product/' + p.id)}, 'View product'),
        h('button', {class:'btn sm', onclick:() => checkout(p)}, 'Buy now'))));
}
function grid(list) {
  if (!list.length) return h('div', {class:'empty'}, h('h3', {}, 'No products found'), h('p', {class:'muted'}, 'Try a different search or clear your filters.'));
  return h('div', {class:'grid'}, list.map(card));
}
function field(label, ctrl, id) {
  return h('div', {class:'field'}, h('label', {for:id}, label), ctrl, h('div', {class:'err', id:'e-' + id, role:'alert'}));
}
function setErr(id, m) { const e = document.getElementById('e-' + id); if (e) e.textContent = m || ''; return !m; }
function counter(inp, max) {
  const c = h('small', {class:'muted'});
  const u = () => { c.textContent = inp.value.length + '/' + max; };
  inp.maxLength = max; inp.addEventListener('input', u); u();
  return c;
}

// Image picker: checks aspect ratio with JS, previews, replace/remove, revokes object URLs.
function picker(ratios, cur, onChange) {
  let url = cur || null, mine = null;
  const msg = h('p', {class:'msg', role:'alert'});
  const infoEl = h('small', {class:'muted'});
  const prev = h('div', {class:'prev'});
  const inp = h('input', {type:'file', accept:'image/*', class:'sr', 'aria-label':'Choose image'});
  const rel = () => { if (mine && url === mine) { URL.revokeObjectURL(mine); mine = null; } };
  const rm = h('button', {type:'button', class:'btn ghost sm', onclick:() => { rel(); url = null; infoEl.textContent = ''; onChange(null); draw(); }}, 'Remove image');
  const rep = h('button', {type:'button', class:'btn ghost sm', onclick:() => inp.click()});
  function draw() {
    prev.replaceChildren(url ? h('img', {src:url, alt:'Preview'}) : h('span', {class:'muted'}, 'No image selected'));
    rm.hidden = !url;
    rep.textContent = url ? 'Replace image' : 'Choose image';
  }
  inp.addEventListener('change', () => {
    const f = inp.files[0];
    if (!f) return;
    msg.textContent = '';
    const u = URL.createObjectURL(f), im = new Image();
    im.onload = () => {
      const r = im.width / im.height;
      const ok = ratios.find(x => Math.abs(r / (x[0] / x[1]) - 1) <= RATIO_TOLERANCE);
      if (!ok) {
        URL.revokeObjectURL(u);
        msg.textContent = 'Unsupported ratio (' + im.width + '\u00D7' + im.height + '). Use ' + ratios.map(x => x.join(':')).join(' or ') + '.';
        return;
      }
      rel(); url = mine = u;
      infoEl.textContent = 'Detected ratio ' + ok.join(':') + ' (' + im.width + '\u00D7' + im.height + ')';
      onChange(u); draw();
    };
    im.onerror = () => { URL.revokeObjectURL(u); msg.textContent = 'That file could not be read as an image.'; };
    im.src = u; inp.value = '';
  });
  draw();
  return h('div', {}, prev, infoEl, msg, inp, h('div', {class:'row'}, rep, rm));
}

/* ---------- Authentication ---------- */
function authView() {
  let mode = 'login', role = 'customer';
  const box = h('div', {class:'auth'});
  const strength = pw => [pw.length >= 8, /[a-z]/.test(pw) && /[A-Z]/.test(pw), /\d/.test(pw), /[^\w\s]/.test(pw)].filter(Boolean).length;
  function enter(email, r) {
    S.user = {email:email, role:r, name:email.split('@')[0]};   // password is never kept
    save();
    notify('Welcome to Digital Product House');
    go(r === 'seller' ? 'dash/overview' : 'home');
  }
  function forgot() {
    const em = h('input', {id:'fe', type:'email'});
    modal('Reset password', field('Email address', em, 'fe'),
      h('button', {class:'btn', onclick:() => {
        // FUTURE EMAIL INTEGRATION: call a backend password-reset endpoint here.

function productForm(id) {
  const ed = id ? S.mine.find(p => p.id === id) : null;
  const d = ed ? Object.assign({}, ed, {kw:[...ed.kw]}) : {name:'', desc:'', kw:[], cat:S.cats[0], price:'', file:''};
  let img = ed ? MEM.imgs[ed.id] : null;
  const nm = h('input', {id:'pn', value:d.name});
  const ds = h('textarea', {id:'pd'}, d.desc);
  const pr = h('input', {id:'pp', type:'number', min:1, step:'any', value:d.price});
  const tags = h('div');
  const ki = h('input', {id:'pk', placeholder:'Type keywords, press comma or Enter'});
  const fn = h('p', {class:'muted'}, d.file || 'No file selected');
  function drawTags() {
    tags.replaceChildren(d.kw.map((k, i) => h('span', {class:'tag'}, k,
      h('button', {type:'button', 'aria-label':'Remove ' + k, onclick:() => { d.kw.splice(i, 1); drawTags(); }}, '\u00D7'))));
  }
  function addKw() {
    ki.value.split(',').map(s => s.trim().toLowerCase()).filter(s => s && !d.kw.includes(s)).forEach(s => d.kw.push(s));
    ki.value = ''; drawTags();
  }
  ki.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addKw(); } });
  ki.addEventListener('blur', addKw);
  drawTags();
  const cs = h('select', {id:'pc'}, S.cats.map(c => h('option', {value:c, selected:c === d.cat}, c)));
  const nc = h('input', {placeholder:'New category', 'aria-label':'New category'});
  const fi = h('input', {type:'file', class:'sr', 'aria-label':'Product file', onchange:e => {
    const f = e.target.files[0];
    if (f) { d.file = f.name; fn.textContent = f.name; }
  }});
  const st = h('select', {id:'ps'}, ['draft', 'published'].map(s => h('option', {value:s, selected:(ed ? ed.status : 'draft') === s}, s === 'draft' ? 'Draft' : 'Published')));
  const pk = picker([[16, 9], [1, 1]], img, u => { img = u; });
  function collect(status, strict) {
    addKw();
    let ok = setErr('pn', nm.value.trim() ? '' : 'Product name is required.');
    ok = setErr('pd', ds.value.trim() ? '' : 'Description is required.') && ok;
    ok = setErr('pp', +pr.value > 0 ? '' : 'Enter a price above \u20B90.') && ok;
    if (strict) ok = setErr('pi', img ? '' : 'Add a 16:9 or 1:1 image before publishing.') && ok;

  }
  function commit(status) {
    const rec = collect(status, status === 'published');
    if (!rec) return;
    if (ed) { Object.assign(ed, rec); MEM.imgs[ed.id] = img; }
    else {
      const n = Object.assign({}, rec, {id:'u' + Date.now(), created:Date.now(), store:'me'});
      S.mine.unshift(n); MEM.imgs[n.id] = img;
    }
    save(); toast(status === 'published' ? 'Product published' : 'Draft saved'); go('dash/products');
  }
  return h('div', {},
    h('h1', {}, ed ? 'Edit product' : 'Add product'),
    h('div', {class:'field'}, h('label', {}, 'Product image (16:9 or 1:1)'), pk,
      h('small', {class:'muted'}, 'Images are kept for this browser session only.'),
      h('div', {class:'err', id:'e-pi', role:'alert'})),
    field('Product name', h('div', {}, nm, counter(nm, 60)), 'pn'),
    field('Description', h('div', {}, ds, counter(ds, 500)), 'pd'),
    field('Keywords', h('div', {}, ki, tags), 'pk'),
    field('Category', h('div', {class:'row'}, cs,
      h('div', {class:'row'}, nc, h('button', {type:'button', class:'btn ghost sm', onclick:() => {
        const v = nc.value.trim();
        if (v && !S.cats.includes(v)) { S.cats.push(v); cs.append(h('option', {value:v, selected:true}, v)); save(); }
        nc.value = '';
      }}, 'Add category'))), 'pc'),
    field('Price (INR)', pr, 'pp'),
    h('div', {class:'field'}, h('label', {}, 'Download file'), fn,
      h('div', {class:'row'},
        h('button', {type:'button', class:'btn ghost sm', onclick:() => fi.click()}, 'Choose or replace file'),
        h('button', {type:'button', class:'btn ghost sm', onclick:() => { d.file = ''; fn.textContent = 'No file selected'; }}, 'Remove file')),
      fi,
      h('small', {class:'muted'}, 'Selecting a file here does not upload or host it. Secure file storage and delivery need a backend.')),
    field('Status', st, 'ps'),
    h('div', {class:'row'},
      h('button', {class:'btn ghost', onclick:() => commit('draft')}, 'Save draft'),
      h('button', {class:'btn', onclick:() => commit('published')}, 'Publish product'),
      h('button', {class:'btn ghost', onclick:() => {
        const r = collect(st.value, false);
        if (r) modal('Preview', card(Object.assign({}, r, {id: ed ? ed.id : 'preview', store:'me', sold:0, pop:0, created:Date.now()})));
      }}, 'Preview product'),
      h('button', {class:'btn ghost', onclick:() => go('dash/products')}, 'Cancel')));
}
const PF = {q:'', cat:'', st:'', sort:'date'};
function myProducts() {
  const out = h('div');
  const by = {name:(a, b) => a.name.localeCompare(b.name), price:(a, b) => a.price - b.price, date:(a, b) => b.created - a.created};
  function draw() {
    const q = PF.q.toLowerCase();
    const l = S.mine.filter(p => (!q || p.name.toLowerCase().includes(q)) && (!PF.cat || p.cat === PF.cat) && (!PF.st || p.status === PF.st)).sort(by[PF.sort]);
    if (!l.length) {
      out.replaceChildren(h('div', {class:'empty'},
        h('h3', {}, S.mine.length ? 'No matching products' : 'No products yet'),
        h('p', {class:'muted'}, 'Add your first digital product to get started.'),
        h('button', {class:'btn', onclick:() => go('dash/add')}, 'Add product')));
      return;
    }
    const rows = l.map(p => h('tr', {},
      h('td', {}, h('div', {class:'thumb'}, art(p))),
      h('td', {}, p.name),
      h('td', {}, inr(p.price)),
      h('td', {}, p.cat),
      h('td', {}, h('span', {class:'chip ' + (p.status === 'published' ? 'ok' : 'off')}, p.status === 'published' ? 'Published' : 'Draft')),
      h('td', {}, fdate(p.created)),
      h('td', {}, h('div', {class:'row'},
        h('button', {class:'btn ghost sm', onclick:() => go('dash/edit/' + p.id)}, 'Edit'),
        h('button', {class:'btn ghost sm', onclick:() => modal('Preview', card(Object.assign({}, p, {store:'me', sold:0})))}, 'Preview'),
        h('button', {class:'btn ghost sm', onclick:() => {
          p.status = p.status === 'published' ? 'draft' : 'published';
          save(); toast(p.status === 'published' ? 'Published' : 'Unpublished'); draw();
        }}, p.status === 'published' ? 'Unpublish' : 'Publish'),
        h('button', {class:'btn danger sm', onclick:async () => {
          if (await confirmBox('Delete "' + p.name + '"? This cannot be undone.')) {
            S.mine.splice(S.mine.indexOf(p), 1); delete MEM.imgs[p.id]; save(); toast('Product deleted'); draw();
          }
        }}, 'Delete')))));
    out.replaceChildren(h('div', {class:'tw'}, h('table', {},
      h('thead', {}, h('tr', {}, ['Image', 'Name', 'Price', 'Category', 'Status', 'Created', 'Actions'].map(c => h('th', {}, c)))),
      h('tbody', {}, rows))));
  }
  function bind(k, c) { c.addEventListener('input', () => { PF[k] = c.value; draw(); }); return c; }
  draw();
  const opt = (arr, cur) => arr.map(x => h('option', {value:x[0], selected:cur === x[0]}, x[1]));
  return h('div', {},
    h('div', {class:'row sb'}, h('h1', {}, 'My products'), h('button', {class:'btn', onclick:() => go('dash/add')}, 'Add product')),
    h('div', {class:'filters'},
      bind('q', h('input', {type:'search', placeholder:'Search products', 'aria-label':'Search', value:PF.q})),
      bind('cat', h('select', {'aria-label':'Category'}, opt([['', 'All categories']].concat(S.cats.map(c => [c, c])), PF.cat))),
      bind('st', h('select', {'aria-label':'Status'}, opt([['', 'All statuses'], ['published', 'Published'], ['draft', 'Draft']], PF.st))),
      bind('sort', h('select', {'aria-label':'Sort'}, opt([['date', 'Newest'], ['name', 'Name'], ['price', 'Price']], PF.sort)))),
    out);
}
const OF = {q:'', st:'', key:'date', dir:-1, n:8};
function ordersView() {
  // FUTURE BACKEND: load verified orders from your server here.
  const out = h('div');
  const cols = [['id','Order ID'],['prod','Product'],['cust','Customer'],['date','Date'],['amt','Amount'],['os','Order status'],['ps','Payment'],['ds','Delivery']];
  function draw() {
    const q = OF.q.toLowerCase();
    const l = ORDERS.filter(o => (!q || (o.id + o.prod + o.cust).toLowerCase().includes(q)) && (!OF.st || o.os === OF.st))
      .sort((a, b) => (a[OF.key] > b[OF.key] ? 1 : -1) * OF.dir);
    if (!l.length) { out.replaceChildren(h('div', {class:'empty'}, 'No orders match your search.')); return; }
    const head = cols.map(c => h('th', {}, h('button', {onclick:() => { OF.dir = OF.key === c[0] ? -OF.dir : 1; OF.key = c[0]; draw(); }},
      c[1] + (OF.key === c[0] ? (OF.dir > 0 ? ' \u25B2' : ' \u25BC') : ''))));
    const rows = l.slice(0, OF.n).map(o => h('tr', {},
      h('td', {}, o.id), h('td', {}, o.prod), h('td', {}, o.cust), h('td', {}, fdate(o.date)),
      h('td', {}, inr(o.amt)), h('td', {}, o.os), h('td', {}, o.ps), h('td', {}, o.ds)));
    out.replaceChildren(
      h('div', {class:'tw'}, h('table', {}, h('thead', {}, h('tr', {}, head)), h('tbody', {}, rows))),
      l.length > OF.n ? h('p', {style:'text-align:center'}, h('button', {class:'btn ghost', onclick:() => { OF.n += 8; draw(); }}, 'Load more')) : '');
  }
  draw();
  return h('div', {},
    h('h1', {}, 'Orders'),
    note('Sample figures shown for layout preview.'),
    h('div', {class:'filters'},
      h('input', {type:'search', 'aria-label':'Search orders', placeholder:'Search orders', oninput:e => { OF.q = e.target.value; OF.n = 8; draw(); }}),
      h('select', {'aria-label':'Status', onchange:e => { OF.st = e.target.value; draw(); }},
        ['', 'Completed', 'Pending', 'Cancelled'].map(v => h('option', {value:v}, v || 'All statuses')))),
    out);
}
function analytics() {
  const m = [['Apr', 12], ['May', 18], ['Jun', 15], ['Jul', 24], ['Aug', 30], ['Sep', 27], ['Oct', 35]];
  const done = ORDERS.filter(o => o.os === 'Completed');
  return h('div', {},
    h('h1', {}, 'Sales analytics'),
    note('Sample figures shown for layout preview.'),
    h('div', {class:'stats'},
      h('div', {class:'stat'}, h('b', {}, ORDERS.length), h('small', {class:'muted'}, 'Total orders')),
      h('div', {class:'stat'}, h('b', {}, inr(done.reduce((a, o) => a + o.amt, 0))), h('small', {class:'muted'}, 'Total revenue'))),
    h('div', {class:'panel'}, h('h2', {}, 'Sales trend'),
      h('div', {class:'bars', role:'img', 'aria-label':'Bar chart of monthly orders'},
        m.map(x => h('div', {style:'height:' + (x[1] / 35 * 100) + '%', title:x[1] + ' orders'}, h('span', {}, x[0]))))),
    h('div', {class:'panel'}, h('h2', {}, 'Best-performing products'),
      SAMPLE.slice().sort(SORTS.best).slice(0, 4).map(p => h('p', {}, p.name))),
    h('div', {class:'panel'}, h('h2', {}, 'Recent orders'),
      ORDERS.slice(0, 5).map(o => h('p', {}, o.id + ' \u2022 ' + o.prod + ' \u2022 ' + inr(o.amt) + ' \u2022 ' + o.os))));
}
function settings() {
  const nm = h('input', {id:'an', value:S.user.name});
  const sn = h('input', {id:'ssn', value:S.store.name});
  const sd = h('textarea', {id:'ssd'}, S.store.desc);
  const up = h('input', {id:'ssu', value:S.store.upi});
  const prefs = [['orders', 'Order notifications'], ['login', 'Login alerts'], ['marketing', 'Product news and offers'], ['analytics', 'Allow usage analytics']];
  const cbs = prefs.map(p => h('p', {}, h('label', {}, h('input', {type:'checkbox', checked:S.prefs[p[0]]}), ' ' + p[1])));
  return h('div', {},
    h('h1', {}, 'Settings'),
    h('div', {class:'panel'}, h('h2', {}, 'Account information'),
      field('Display name', nm, 'an'),
      h('p', {class:'muted'}, 'Email: ' + S.user.email)),
    h('div', {class:'panel'}, h('h2', {}, 'Store information'),
      field('Store name', sn, 'ssn'),
      field('Store description', sd, 'ssd'),
      field('UPI ID', up, 'ssu'),
      h('div', {class:'row'}, h('span', {}, 'Store logo: ' + (MEM.logo ? 'set' : 'not set')),
        h('button', {class:'btn ghost sm', onclick:() => go('dash/store')}, 'Change logo'))),
    h('div', {class:'panel'}, h('h2', {}, 'Notification preferences'), cbs),
    h('div', {class:'panel'}, h('h2', {}, 'Privacy'),
      h('p', {class:'muted'}, 'Your store and product details are saved in this browser only.'),
      h('button', {class:'btn ghost sm', onclick:async () => {
        if (await confirmBox('Clear all data saved in this browser?', 'Clear data')) {
          localStorage.removeItem('dph'); S = defaults(); toast('Saved data cleared'); go('home');
        }
      }}, 'Clear saved data')),
    h('div', {class:'panel'}, h('h2', {}, 'Membership'),
      h('p', {}, 'Current plan: none'),
      h('button', {class:'btn ghost sm', onclick:() => go('dash/membership')}, 'View plans')),
    h('div', {class:'row'},
      h('button', {class:'btn', onclick:() => {
        let ok = setErr('an', nm.value.trim() ? '' : 'Enter a name.');
        ok = setErr('ssn', sn.value.trim() ? '' : 'Store name is required.') && ok;
        ok = setErr('ssu', !up.value.trim() || UPI_RE.test(up.value.trim()) ? '' : 'UPI ID should look like name@bank.') && ok;
        if (!ok) return;
        S.user.name = nm.value.trim();
        Object.assign(S.store, {name:sn.value.trim(), desc:sd.value.trim(), upi:up.value.trim(), saved:true});
        cbs.forEach((c, i) => { S.prefs[prefs[i][0]] = c.querySelector('input').checked; });
        save(); toast('Settings saved');
      }}, 'Save settings'),
      h('button', {class:'btn ghost', onclick:() => render(true)}, 'Cancel')));
}

/* ---------- Router ---------- */
function pageFor(r, a) {
  if (r === 'explore') return exploreView();
  if (r === 'best') { F.sort = 'best'; F.cat = ''; return exploreView(); }
  if (r === 'categories') return h('div', {class:'wrap sec'}, h('h1', {}, 'Categories'), catsView());
  if (r === 'membership') return h('div', {class:'wrap sec'}, h('h1', {}, 'Membership'), plansView());
  if (r === 'product') return productView(a);
  if (r === 'store') return storeView(a || 'me');
  if (r === 'sell') {
    return h('div', {class:'wrap sec'},
      h('h1', {}, 'Become a seller'),
      h('p', {class:'muted'}, 'Create a store, publish products and manage orders from one dashboard.'),
      h('button', {class:'btn', onclick:() => { S.user.role = 'seller'; save(); go('dash/overview'); }},
        S.user.role === 'seller' ? 'Open seller dashboard' : 'Start selling'));
  }
  return homeView();
}
function render(keep) {
  const parts = (location.hash.slice(1) || 'home').split('/');
  const r = parts[0], a = parts[1], b = parts[2];
  $app.replaceChildren();
  if (dlg.open) dlg.close();
  if (!S.user) { $app.append(authView()); return; }
  if (r === 'dash' && S.user.role !== 'seller') { go('sell'); return; }
  $app.append(
    header(),
    r === 'dash' ? dashView(a || 'overview', b) : h('main', {id:'main'}, pageFor(r, a)),
    footer());
  if (!keep) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => render());
render();
</script>
